#Based on https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.conf


source-file ~/.config/tmux/tmux.reset.conf


# Set True Color
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-features 'contour:sixel'.

# Enable Mouse
set -g mouse on

# Change Prefix to ^a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
# setw -g mode-keys vi
set -g pane-active-border-style 'fg=#0F131A,bg=#b3b1ad'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'



# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Bind splitting with current path
bind M-h split-window -v -c "#{pane_current_path}"
bind M-l split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'teddy-bear-123/tmux-ayu'
set -g @plugin 'teddy-bear-123/tmux-cheatsheet'




# Plugin Setup

set -g @cheatsheet '^l'           # toggle cheatsheet
set -g @resurrect-restore '^R'
set -g @continuum-restore 'off'     # auto restore shit always
set -g @resurrect-strategy-nvim 'session'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/Dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

set -g @ayu_flavour 'dark'
# set -g @ayu_window_left_separator ""                                    # remember, windows left side (i.e. the numbers, windows )
# set -g @ayu_window_right_separator " "
# set -g @ayu_window_middle_separator " █"
set -g @ayu_window_number_position "left"
set -g @ayu_window_default_fill "number"
set -g @ayu_window_default_text "#W"
set -g @ayu_window_current_fill "number"
set -g @ayu_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @ayu_status_modules_right "session directory date_time"
set -g @ayu_status_left_separator  " "
set -g @ayu_status_right_separator " "
set -g @ayu_status_right_separator_inverse "no"
set -g @ayu_status_fill "icon"
set -g @ayu_status_connect_separator "no"
set -g @ayu_directory_text "#{b:pane_current_path}"
set -g @ayu_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @ayu_date_time_text "%H:%M"



run '~/.tmux/plugins/tpm/tpm'

