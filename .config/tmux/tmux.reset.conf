# Based on https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.reset.conf
unbind-key -a

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"


bind h select-pane -L                     # Vim motions to move around panes  
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H previous-window                    # Vim motions to move around windows 
bind L next-window


bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

bind ^X lock-server
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "$HOME"
bind n new-window
bind N new-session -c "$HOME"
bind ^D detach
bind * list-clients
bind ^A last-window
bind ^W list-windows

bind ^K kill-window
bind ^C kill-pane
bind S choose-session

bind : command-prompt


bind ^L refresh-client
bind l refresh-client


bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window

bind z resize-pane -Z
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7


bind * setw synchronize-panes
bind P set pane-border-status
bind x swap-pane -D
bind-key -T copy-mode-vi v send-keys -X begin-selection

